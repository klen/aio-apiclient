name: release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.11'
        enable-cache: true

    - name: Build package
      run: uv build

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:

    - name: Download a distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.pypi }}
